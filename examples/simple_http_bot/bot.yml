workspace: simple-http-bot
profiles: [default, dev]

bots:
  - id: simple-bot
    channels:
      - "http:/api/chat"
    system_prompt: prompts/system.md
    model: openai:gpt-4o-mini
    tools: []

providers:
  openai:
    api_key: env:OPENAI_API_KEY

adapters:
  http:
    api_key: env:BOT_HTTP_KEY
