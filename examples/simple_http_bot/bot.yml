workspace: simple-http-bot

providers:
  anthropic:
    api_key: env:ANTHROPIC_API_KEY
    max_tokens: 1024

adapters:
  http:
    api_key: env:BOT_HTTP_KEY

bots:
  - id: simple-bot
    model: anthropic:claude-sonnet-4-20250514
    system_prompt: prompts/system.md
    channels:
      - http:/api/chat
