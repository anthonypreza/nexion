workspace: advanced-bot

providers:
  openai:
    api_key: env:OPENAI_API_KEY
    max_tokens: 1024
  anthropic:
    api_key: env:ANTHROPIC_API_KEY
    max_tokens: 1024

adapters:
  http:
    api_key: env:BOT_HTTP_KEY
  telegram:
    bot_token: env:TELEGRAM_BOT_TOKEN

bots:
  - id: support-bot
    model: openai:gpt-4o-mini
    system_prompt: prompts/support.md
    channels:
      - http:/api/chat
      - telegram:@supportbot

  - id: docs-bot
    model: anthropic:claude-3-sonnet
    system_prompt: prompts/docs.md
    channels:
      - http:/api/docs-chat

