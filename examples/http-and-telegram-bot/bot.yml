workspace: http-and-telegram-bot

providers:
  openai:
    api_key: env:OPENAI_API_KEY
    max_tokens: 1024

adapters:
  http:
    api_key: env:BOT_HTTP_KEY
  telegram:
    bot_token: env:TELEGRAM_BOT_TOKEN

bots:
  - id: dual-channel-bot
    model: openai:gpt-4o-mini
    system_prompt: prompts/system.md
    channels:
      - http:/api/chat
      - telegram:@mybot
