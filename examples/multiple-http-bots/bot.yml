workspace: multiple-http-bots

providers:
  openai:
    api_key: env:OPENAI_API_KEY
    max_tokens: 1024

adapters:
  http:
    api_key: env:BOT_HTTP_KEY

bots:
  - id: faq-bot
    model: openai:gpt-4o-mini
    system_prompt: prompts/faq.md
    channels:
      - http:/api/faq/chat

  - id: sales-bot
    model: openai:gpt-4o-mini
    system_prompt: prompts/sales.md
    channels:
      - http:/api/sales/chat
