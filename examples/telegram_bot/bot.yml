workspace: telegram-bot
profiles: [default, dev]

bots:
  - id: telegram-bot
    channels:
      - "telegram:@mybot"
    system_prompt: prompts/system.md
    model: openai:gpt-4o-mini
    tools: []

providers:
  openai:
    api_key: env:OPENAI_API_KEY

adapters:
  telegram:
    bot_token: env:TELEGRAM_BOT_TOKEN
