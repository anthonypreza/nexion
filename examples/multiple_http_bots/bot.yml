workspace: multiple-http-bots
profiles: [default, dev]

bots:
  - id: faq-bot
    channels: 
      - "http:/api/faq/chat"
    system_prompt: prompts/faq.md
    model: openai:gpt-5-nano
    tools: []
  - id: sales-bot
    channels:
      - "http:/api/sales/chat"
    system_prompt: prompts/sales.md
    model: openai:gpt-5-nano
    tools: []

providers:
  openai:
    api_key: env:OPENAI_API_KEY

adapters:
  http:
    api_key: env:BOT_HTTP_KEY
