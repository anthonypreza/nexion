[project]
name = "nexion"
version = "0.1.0"
description = "An open-source bot factory: define once, deploy everywhere with HTTP, Telegram, Discord, and more."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "pydantic>=1.10.22",
    "sqlmodel>=0.0.14",
    "typer>=0.17.4",
    "uvicorn[standard]>=0.35.0",
    "pyyaml>=6.0",
    "mcp>=1.13.1",
    "httpx-ws>=0.7.2",
]

scripts.nexctl = "nexion.cli.nexctl:app"

[dependency-groups]
dev = [
    "pre-commit>=3.6.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
